<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Part 3 – Specificity Detective</title>
  <style>
    /* R1 */
    p { color: gray; }
    /* R2 */
    .note { color: teal; }
    /* R3 */
    div p { color: navy; }
    /* R4 */
    .box .note { color: purple; }
    /* R5 */
    #special { color: crimson; }
    /* R6 */
    div.box p.note { color: olive; }
    /* R7 */
    .box > p { color: saddlebrown; }
    /* R8 */
    p#special { color: darkorange; }
    /* R9 */
    #evidence { color: green; }
    /* R10 */
    section .item { color: slateblue; }
    /* R11 */
    .inherit-demo { color: crimson; border: 2px solid crimson; }
  </style>
</head>
<body>
  <p>E1: Plain paragraph</p>
  <p class="note">E2: Note paragraph</p>
  <div class="box">
    <p>E3: Paragraph inside box</p>
    <p class="note">E4: Note inside box</p>
  </div>
  <p id="special" class="note">E5: Special note</p>
  <section>
    <div id="evidence" class="item">E6: Evidence item</div>
  </section>
  <p id="special" style="color: hotpink;">E7: Inline style override</p>
  <p id="special">E8: Another special</p>
  <div class="box">
    <p class="note">E9: Box note</p>
  </div>
  <div class="item">E10: Item outside section</div>
  <div class="inherit-demo">
    E11: Inherited parent <em id="em-child">emphasized child</em> and <a href="#">link child</a>
  </div>
</body>
</html>
