<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Layout Playground – Parts 5, 7, 8, 9</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 2rem;
      background-color: #f8f6f2;
      color: #222222;
    }

    section {
      margin-bottom: 3rem;
      padding: 1.5rem;
      background-color: #ffffff;
      border: 1px solid #dddddd;
      border-radius: 8px;
    }

    h2 {
      margin-top: 0;
    }

    /* Section A: Box Model */
    .box-a {
      width: 200px;
      padding: 20px;
      border: 5px solid #6b3e26;
      margin: 20px;
      box-sizing: content-box;
      background-color: #fdf6ec;
    }

    /* Section B: Flexbox */
    .flex-b {
      display: flex;
      gap: 1rem;
      padding: 1rem;
      background-color: #faf4ec;
      border: 1px dashed #999999;
    }

    .flex-item {
      padding: 1rem;
      background-color: #f2c94c;
      border: 1px solid #6b3e26;
      font-weight: 600;
    }

    /* Section C: Grid */
    .grid-c {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      padding: 1rem;
      background-color: #faf4ec;
      border: 1px dashed #999999;
    }

    .grid-item {
      padding: 1rem;
      background-color: #e6d7c3;
      border: 1px solid #6b3e26;
      font-weight: 600;
    }

    /* Section D: Positioning */
    .pos-playground {
      position: relative;
      height: 180px;
      overflow: auto;
      padding: 1rem;
      background-color: #faf4ec;
      border: 2px dashed #6b3e26;
    }

    .pos-box {
      padding: 0.75rem 1rem;
      background-color: #f2c94c;
      border: 1px solid #6b3e26;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <section id="sec-a">
    <h2>Section A – Box Model</h2>
    <div class="box-a">Box Model Test Box</div>
  </section>

  <section id="sec-b">
    <h2>Section B – Flexbox</h2>
    <div class="flex-b">
      <div class="flex-item">Item 1</div>
      <div class="flex-item">Item 2</div>
      <div class="flex-item">Item 3<br>Taller</div>
    </div>
  </section>

  <section id="sec-c">
    <h2>Section C – Grid</h2>
    <div class="grid-c">
      <div class="grid-item">Grid 1</div>
      <div class="grid-item">Grid 2</div>
      <div class="grid-item">Grid 3</div>
      <div class="grid-item">Grid 4</div>
      <div class="grid-item">Grid 5</div>
      <div class="grid-item">Grid 6</div>
    </div>
  </section>

  <section id="sec-d">
    <h2>Section D – Positioning</h2>
    <div class="pos-playground">
      <div>Before</div>
      <div class="pos-box">Positioned Box</div>
      <div>After</div>
      <div style="height: 260px;">Scroll space</div>
    </div>
  </section>
</body>
</html>
