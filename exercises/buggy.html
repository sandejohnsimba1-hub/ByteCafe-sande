<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Debug Clinic</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #f4f4f4;
      color: #222222;
      margin: 2rem;
    }

    h1 {
      color: #0b2c8a;
    }

    .reading-list {
      list-style-type: none;
      padding-left: 0;
    }

    .reading-list li::before {
      content: "★ ";
      color: #e67e00;
    }

    .featured-title {
      color: #1b7a1b;
    }

    .contact-box {
      border: 1px solid #999999;
      padding: 1rem;
      max-width: 500px;
      background-color: #ffffff;
    }

    .form-row {
      display: grid;
      grid-template-columns: 100px 1fr;
      gap: 0.75rem;
      align-items: center;
      margin-bottom: 0.75rem;
    }

    .form-row label {
      text-align: right;
    }

    .form-row input {
      width: 100%;
      padding: 0.35rem;
    }

    .form-actions {
      display: grid;
      grid-template-columns: 100px 1fr;
      gap: 0.75rem;
    }

    .form-actions button {
      grid-column: 2 / 3;
      width: 100%;
      padding: 0.35rem;
    }
  </style>
</head>
<body>
  <h1>Debug Clinic</h1>

  <section>
    <h2>MY READING LIST</h2>
    <ul class="reading-list">
      <li>CSS in Depth</li>
      <li>CSS: The Definitive Guide</li>
      <li>CSS Secrets</li>
    </ul>
  </section>

  <section>
    <h2>FEATURED</h2>
    <h3 class="featured-title">Learning Grid Layout</h3>
    <p>Two-dimensional layouts made simple.</p>
  </section>

  <section>
    <h2>CONTACT US</h2>
    <div class="contact-box">
      <form>
        <div class="form-row">
          <label for="name">Name</label>
          <input id="name" name="name" type="text">
        </div>
        <div class="form-row">
          <label for="email">Email</label>
          <input id="email" name="email" type="email">
        </div>
        <div class="form-actions">
          <button type="submit">Send</button>
        </div>
      </form>
    </div>
  </section>
</body>
</html>
